<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cotización · Gensat LLC</title>
<style>
:root{--navy:#14213d;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#e0a526;--teal:#1a8f86;--soft:#f6f7fb;--green:#16794c;--bg:#eef1f6;--card:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px}
.band{height:8px;background:linear-gradient(90deg,var(--navy) 0 70%,var(--teal) 70% 88%,var(--accent) 88%)}
header{display:flex;align-items:center;gap:12px;max-width:820px;margin:0 auto;padding:18px 16px 6px}
.logo{width:44px;height:44px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;flex:none}
.logo span{color:var(--accent)}
header h1{margin:0;font-size:20px;color:var(--navy);letter-spacing:.5px}
header p{margin:0;font-size:13px;color:var(--muted)}
main{max-width:820px;margin:0 auto;padding:10px 16px 40px}
.panel{background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(20,33,61,.08);padding:22px}
/* gate */
#gate{max-width:420px;margin:40px auto;text-align:center}
#gate h2{color:var(--navy);margin:6px 0}
#gate p{color:var(--muted);margin:0 0 18px;font-size:15px}
#gate .lock{font-size:38px}
#gate input{width:100%;font-size:20px;letter-spacing:3px;text-align:center;text-transform:uppercase;padding:13px;border:2px solid var(--line);border-radius:12px;outline:none}
#gate input:focus{border-color:var(--teal)}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
#err{color:#b42318;font-size:14px;min-height:20px;margin-top:10px}
/* quote */
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:22px}
.hero h1{margin:4px 0 8px;font-size:26px}
.hero p{margin:0;opacity:.92}
.tagline{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.5px}
section{background:var(--card);border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 2px 14px rgba(20,33,61,.06)}
h2{display:flex;align-items:center;gap:10px;color:var(--navy);font-size:19px;margin:0 0 12px}
h2 span{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--navy);font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
h3{margin:0;font-size:16px;color:var(--navy)}
a{color:var(--teal);font-weight:600}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0;padding-top:0}
.ihead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.ihead b{color:var(--navy);white-space:nowrap}
.item p{margin:4px 0}
ul{margin:6px 0 0;padding-left:20px;font-size:15px}
li{margin:2px 0}
.totals .row{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.totals .disc{color:var(--green)}
.totals .grand{background:var(--navy);color:#fff;border-radius:12px;padding:14px;margin-top:8px;font-size:20px;border:0}
.totals .grand b{color:var(--accent)}
.totals b{white-space:nowrap}
.note{background:#fffaf0;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;margin-top:14px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1.5px solid var(--line);border-radius:14px;padding:14px;position:relative}
.card.rec{border-color:var(--teal);box-shadow:0 0 0 3px rgba(26,143,134,.12)}
.badge{position:absolute;top:-11px;right:12px;background:var(--teal);color:#fff;font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px}
.opt{font-size:12px;color:var(--teal);font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.price{font-size:28px;font-weight:800;color:var(--navy);margin:4px 0}
.price small{font-size:14px;color:var(--muted);font-weight:600}
.small{font-size:14px;color:var(--muted);margin:10px 0 0}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.methods div{background:var(--soft);border-radius:12px;padding:11px;font-size:14px}
.methods b{display:block;color:var(--navy);font-size:15px}
.maint{border:1.5px solid var(--navy);border-radius:14px;padding:14px;margin-bottom:10px}
.extras>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.extras>div>b{color:var(--navy);text-align:right;white-space:nowrap}
.extras i{color:var(--muted);font-style:normal;font-size:14px}
.extras s{color:var(--muted);font-weight:400}
.terms{font-size:14.5px}
.pick{display:grid;gap:12px}
.grp b{display:block;margin-bottom:6px;color:var(--navy)}
.grp button{margin:0 6px 6px 0;padding:9px 14px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--ink)}
.grp button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.msgbox{margin-top:14px;background:var(--soft);border-radius:12px;padding:12px}
.msg{white-space:pre-line;font-size:15px;background:#fff;border-radius:10px;padding:10px;border:1px solid var(--line)}
.copy{margin-top:10px;padding:10px 16px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.thanks{text-align:center;color:var(--navy);margin:22px 0 0}
.thanks em{color:var(--teal);font-style:normal;font-weight:700}
.out{display:block;margin:18px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 24px}
@media (max-width:640px){
  .cards,.methods{grid-template-columns:1fr}
  .methods{grid-template-columns:1fr 1fr}
  .extras>div{flex-direction:column;gap:2px}.extras>div>b{text-align:left}
  .totals .grand{font-size:18px}
  .hero h1{font-size:23px}
}
@media print{body{background:#fff}.out,#gate,.pick,.msgbox,.copy{display:none!important}section{box-shadow:none;break-inside:avoid}}
</style>
</head>

<header>
  <div class="logo">G<span>.</span></div>

  <form id="gate" class="panel" autocomplete="off">

    <button class="btn" id="go" type="submit">Ver cotización</button>
    <div id="err" role="alert"></div>
  </form>

</main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(code){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(code.trim().toUpperCase().replace(/\s+/g,'')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BOX.s),iterations:BOX.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BOX.v)},key,b64(BOX.c));
  return new TextDecoder().decode(pt);
}
function show(html,code){
  const q=document.getElementById('quote');
  q.innerHTML=html+'<button class="out" type="button">Cerrar cotización</button>';
  q.hidden=false;document.getElementById('gate').hidden=true;
  try{sessionStorage.setItem('gq',code)}catch(e){}
  q.querySelector('.out').onclick=()=>{try{sessionStorage.removeItem('gq')}catch(e){};location.reload()};
  const sel={};
  q.querySelectorAll('.grp').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel[g.dataset.g]=b.dataset.v;
    const box=q.querySelector('.msgbox');box.hidden=false;
    box.querySelector('.msg').textContent='Hola Yeison, acepto la cotización GEN-2026-001 de Gensat LLC.\n'+(sel.pago||'Opción de pago: (por elegir)')+'\n'+(sel.mant||'Mantenimiento: (por elegir)')+'\nPor favor envíame los datos para el pago. ¡Gracias!';
  }));
  const c=q.querySelector('.copy');
  if(c)c.onclick=async()=>{const t=q.querySelector('.msg').textContent;try{await navigator.clipboard.writeText(t);c.textContent='¡Copiado!'}catch(e){const r=document.createRange();r.selectNodeContents(q.querySelector('.msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent='Selecciona y copia el texto'}setTimeout(()=>c.textContent='Copiar mensaje',2500)};
  window.scrollTo(0,0);
}
document.getElementById('gate').onsubmit=async e=>{
  e.preventDefault();
  const code=document.getElementById('code').value,err=document.getElementById('err'),go=document.getElementById('go');
  if(!code.trim()){err.textContent='Escribe tu código.';return}
  go.disabled=true;go.textContent='Abriendo…';err.textContent='';
  try{show(await unlock(code),code)}catch(x){err.textContent='El código no es correcto. Revísalo e inténtalo otra vez.'}
  go.disabled=false;go.textContent='Ver cotización';
};
